[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostcall-lint"
version = "0.1.0"
description = "Find hallucinated and outdated library API usage by checking code against the library versions actually installed"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Zahid Hasan" }]
keywords = ["static-analysis", "linter", "llm", "hallucination", "api", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "griffe>=2.0",
  "typeshed-client>=2.5",
  "typer>=0.12",
  # typer vendors its own click, but the CLI catches click's exception types.
  "click>=8.1",
  "rich>=13.0",
  "rapidfuzz>=3.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-cov>=5.0",
  # Tests parse the CI workflows and .pre-commit-hooks.yaml.
  "pyyaml>=6.0",
  "pre-commit>=3.5",
]

[project.scripts]
ghostcall = "ghostcall.cli:main"

[project.urls]
Homepage = "https://github.com/zahidhasann88/ghostcall-lint"
Issues = "https://github.com/zahidhasann88/ghostcall-lint/issues"
Changelog = "https://github.com/zahidhasann88/ghostcall-lint/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostcall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:ghostcall.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# The corpora are *data*: they deliberately contain unusual-but-valid code.
extend-exclude = ["bench/clean", "bench/hallucinations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "RUF", "ARG", "PTH", "TID"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B011"]
"bench/*" = ["ARG"]
# EnvNotFound / EnvUnusable read better without an Error suffix.
"src/ghostcall/env.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ghostcall"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["typeshed_client.*"]
ignore_missing_imports = true

[tool.ghostcall]
# Default configuration for this repository.
source-roots = ["src"]
ignore = []

[tool.uv]
package = true
